[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wandao-launchpad"
version = "0.1.0"
description = "万道启动台 WandaoLaunchpad —— 万道自研 ComfyUI 启动器（GUI + CLI 同体）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Wandao / 陈守一" }]
dependencies = [
    "PyQt5>=5.15.9,<5.16",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wandao-launchpad = "wandao_launchpad.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
