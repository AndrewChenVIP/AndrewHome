name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: pytest --tb=short 2>&1 | Tee-Object -FilePath test-output.txt
        shell: pwsh
      - name: Show failures (visible in run summary)
        if: always()
        shell: pwsh
        run: |
          Get-Content test-output.txt -ErrorAction SilentlyContinue | Select-Object -Last 60 | ForEach-Object { Write-Output $_ }
      - name: Gate
        if: always()
        shell: pwsh
        run: |
          if (Select-String -Path test-output.txt -Pattern "FAILED|ERROR" -Quiet -ErrorAction SilentlyContinue) { exit 1 }
