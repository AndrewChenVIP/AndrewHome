name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -e .[test]
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
