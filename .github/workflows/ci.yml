name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: pytest --tb=long 2>&1 | Tee-Object -FilePath test-output.txt
        shell: pwsh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7
      - name: Gate
        if: always()
        shell: pwsh
        run: |
          if (Select-String -Path test-output.txt -Pattern "FAILED|ERROR" -Quiet -ErrorAction SilentlyContinue) {
            Write-Output "TESTS FAILED"
            exit 1
          }
